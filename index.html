<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EL ODIO GARPA</title>

<style>

/* =================================
   CONFIGURACIÓN GENERAL
================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    font-family: Arial, sans-serif;
}

#pantalla {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: #000;
}


/* =================================
   FONDOS
================================= */

.fondo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    z-index: 0;
}


/* =================================
   CUADRO DE TEXTO
================================= */

#cuadro-texto {

    display: none;
    position: absolute;

    width: min(42vw, 520px);
    min-height: 65px;

    left: 48.5%;
    top: 35%;

    transform: translate(-50%, -50%);

    background: white;
    border: 2px solid #999;
    border-radius: 5px;

    align-items: center;
    padding: 0 20px;

    z-index: 1;
    pointer-events: none;
    overflow: hidden;
}


/* TEXTO QUE SE ESCRIBE */

#texto-escrito {
    color: #222;
    font-size: clamp(18px, 2vw, 25px);
    white-space: pre;
}


/* CURSOR PARPADEANTE */

#cursor {
    display: inline-block;
    width: 2px;
    height: 25px;
    background: #333;
    margin-left: 3px;
    animation: parpadear 0.8s infinite;
}

@keyframes parpadear {

    0%, 50% {
        opacity: 1;
    }

    51%, 100% {
        opacity: 0;
    }

}


/* =================================
   IMÁGENES DE PUBLICACIONES
================================= */

.imagen-publicacion {

    position: absolute;

    width: min(48vw, 680px);
    max-height: 75vh;
    height: auto;

    object-fit: contain;
    z-index: 2;
    pointer-events: none;

    animation: aparecer 0.3s ease;

}

@keyframes aparecer {

    from {
        opacity: 0;
        transform: scale(0.9);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}


/* =================================
   ADAPTACIÓN A OTRAS PANTALLAS
================================= */

@media (max-width: 700px) {

    .imagen-publicacion {
        width: 65vw;
        max-height: 65vh;
    }

    #cuadro-texto {
        width: 75vw;
        min-height: 55px;
    }

}

</style>

</head>


<body>

<div id="pantalla">

    <!-- FONDO DE PANTALLA -->

    <img
        id="fondo"
        class="fondo"
        src="fondo.01.png"
        alt=""
    >


    <!-- CUADRO DE TEXTO -->

    <div id="cuadro-texto">

        <span id="texto-escrito"></span>

        <span id="cursor"></span>

    </div>

</div>


<script>


// =================================
// ELEMENTOS
// =================================

const fondo = document.getElementById("fondo");

const pantalla = document.getElementById("pantalla");

const cuadroTexto = document.getElementById("cuadro-texto");

const textoEscrito = document.getElementById("texto-escrito");


let pantallaActual = 1;


// =================================
// FONDOS DE LAS PANTALLAS
// =================================

const fondos = {

    1: "fondo.01.png",
    2: "fondo.02.png",
    3: "fondo.03.png",
    4: "fondo.04.png"

};


function cambiarPantalla(numero) {

    pantallaActual = numero;

    fondo.src = fondos[numero];

    if (numero === 3) {

        cuadroTexto.style.display = "flex";

    } else {

        cuadroTexto.style.display = "none";

    }

}


// =================================
// ESCRITURA SIMULADA
// =================================

const letrasTeclado = {

    "KeyR": "E",
    "KeyT": "L",

    "Space": " ",

    "KeyU": "O",
    "KeyI": "D",
    "KeyO": "I",
    "KeyP": "O",

    "KeyV": "G",
    "KeyB": "A",
    "KeyN": "R",
    "KeyM": "P",

    "Comma": "A"

};


let textoActual = "";


function escribirLetra(tecla) {

    // La frase completa tiene 13 caracteres.

    if (textoActual.length >= 13) {

        return;

    }

    textoActual += letrasTeclado[tecla];

    textoEscrito.textContent = textoActual;

}


// =================================
// IMÁGENES
// =================================

let numeroImagen = 1;


function mostrarImagen() {

    const imagen = document.createElement("img");

    imagen.classList.add("imagen-publicacion");

    imagen.src =
        `imagenes/tweet.${String(numeroImagen).padStart(2, "0")}.png`;


    imagen.onload = function() {

        const anchoPantalla = window.innerWidth;

        const altoPantalla = window.innerHeight;

        const ancho = imagen.offsetWidth;

        const alto = imagen.offsetHeight;

        const maxX = Math.max(0, anchoPantalla - ancho);

        const maxY = Math.max(0, altoPantalla - alto);


        // Zona reservada para el texto de reinicio.
        // Esquina inferior derecha.

        const zonaDerecha = anchoPantalla * 0.70;

        const zonaArriba = altoPantalla * 0.82;


        let posicionX = 0;

        let posicionY = 0;

        let posicionValida = false;


        // Buscar una posición que no invada la zona protegida.

        for (let intento = 0; intento < 100; intento++) {

            posicionX = Math.random() * maxX;

            posicionY = Math.random() * maxY;


            const invadeZonaProtegida =

                posicionX + ancho > zonaDerecha &&

                posicionY + alto > zonaArriba;


            if (!invadeZonaProtegida) {

                posicionValida = true;

                break;

            }

        }


        // Posición alternativa si no encuentra espacio.

        if (!posicionValida) {

            posicionX = Math.random() * maxX;

            posicionY = Math.random() * (altoPantalla * 0.65);

        }


        imagen.style.left = posicionX + "px";

        imagen.style.top = posicionY + "px";

    };


    imagen.onerror = function() {

        console.error("No se pudo cargar la imagen:", imagen.src);

        imagen.remove();

    };


    pantalla.appendChild(imagen);


    numeroImagen++;

    if (numeroImagen > 10) {

        numeroImagen = 1;

    }

}


// =================================
// AUDIOS
// =================================

let numeroAudio = 1;

let colaAudios = [];

let audioActual = null;

let reproduciendo = false;


// Volumen general para todos los audios.

const volumenGeneral = 0.70;


function agregarAudio() {

    const ruta =

        `audios/milei.${String(numeroAudio).padStart(2, "0")}.mp3`;


    colaAudios.push(ruta);


    numeroAudio++;

    if (numeroAudio > 11) {

        numeroAudio = 1;

    }


    reproducirSiguiente();

}


function reproducirSiguiente() {

    if (reproduciendo || colaAudios.length === 0) {

        return;

    }


    reproduciendo = true;

    const ruta = colaAudios.shift();

    audioActual = new Audio(ruta);

    audioActual.volume = volumenGeneral;


    audioActual.onended = function() {

        audioActual = null;

        reproduciendo = false;

        reproducirSiguiente();

    };


    audioActual.onerror = function() {

        console.error("Error al reproducir:", ruta);

        audioActual = null;

        reproduciendo = false;

        reproducirSiguiente();

    };


    audioActual.play().catch(function(error) {

        console.error("No se pudo reproducir el audio:", error);

        audioActual = null;

        reproduciendo = false;

        reproducirSiguiente();

    });

}


// =================================
// LIMPIAR PANTALLA 3
// =================================

function limpiarPantalla3() {

    // Eliminar todas las imágenes.

    document
        .querySelectorAll(".imagen-publicacion")
        .forEach(function(imagen) {

            imagen.remove();

        });


    // Detener el audio actual.

    if (audioActual) {

        audioActual.onended = null;

        audioActual.onerror = null;

        audioActual.pause();

        audioActual.currentTime = 0;

        audioActual = null;

    }


    // Vaciar la cola de audios pendientes.

    colaAudios = [];

    reproduciendo = false;

}


// =================================
// ACTIVAR INTERACCIÓN
// =================================

function activarInteraccion(tecla) {

    // Escribir la letra correspondiente.

    escribirLetra(tecla);


    // Mostrar una imagen.

    mostrarImagen();


    // Agregar un audio a la cola.

    agregarAudio();

}


// =================================
// REINICIAR TODO
// =================================

function reiniciarTodo() {

    // Eliminar todas las imágenes.

    document
        .querySelectorAll(".imagen-publicacion")
        .forEach(function(imagen) {

            imagen.remove();

        });


    // Detener el audio actual.

    if (audioActual) {

        audioActual.onended = null;

        audioActual.onerror = null;

        audioActual.pause();

        audioActual.currentTime = 0;

        audioActual = null;

    }


    // Vaciar la cola de audios.

    colaAudios = [];

    reproduciendo = false;


    // Reiniciar secuencias.

    numeroImagen = 1;

    numeroAudio = 1;


    // Limpiar el cuadro de texto.

    textoActual = "";

    textoEscrito.textContent = "";


    // Volver a la pantalla inicial.

    cambiarPantalla(1);

}


// =================================
// CONTROL DEL TECLADO
// =================================

document.addEventListener("keydown", function(event) {

    // Evitar repeticiones al mantener una tecla.

    if (event.repeat) {

        return;

    }


    // No interferir con atajos del navegador.

    if (event.ctrlKey || event.altKey || event.metaKey) {

        return;

    }


    // =================================
    // ESCAPE
    // =================================

    if (event.code === "Escape") {

        event.preventDefault();

        if (pantallaActual === 4) {

            reiniciarTodo();

        }

        return;

    }


    // =================================
    // PANTALLA 1
    // =================================

    if (pantallaActual === 1) {

        if (event.code === "ArrowRight") {

            event.preventDefault();

            cambiarPantalla(3);

        }

        if (event.code === "ArrowLeft") {

            event.preventDefault();

            cambiarPantalla(2);

        }

        return;

    }


    // =================================
    // PANTALLA 2
    // =================================

    if (pantallaActual === 2) {

        if (event.code === "Enter") {

            event.preventDefault();

            cambiarPantalla(3);

        }

        return;

    }


    // =================================
    // PANTALLA 3
    // =================================

    if (pantallaActual === 3) {

        // Enter lleva a la pantalla 4.

        if (event.code === "Enter") {

            event.preventDefault();

            // Detener audios y eliminar imágenes.

            limpiarPantalla3();

            // Cambiar a la pantalla 4.

            cambiarPantalla(4);

            return;

        }


        // Teclas que escriben y activan imágenes y sonidos.

        if (Object.prototype.hasOwnProperty.call(letrasTeclado, event.code)) {

            event.preventDefault();

            activarInteraccion(event.code);

        }

        return;

    }

});


// =================================
// INICIO
// =================================

cambiarPantalla(1);


</script>

</body>

</html>
